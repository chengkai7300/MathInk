<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MathInk · 手写公式转 LaTeX</title>
  <link rel="stylesheet" href="/vendor/katex/dist/katex.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">∫</span>
      <div>
        <h1>MathInk</h1>
        <p>鼠标手写数学公式 → LaTeX</p>
      </div>
    </div>
    <div class="status">
      <span id="engine-badge" class="badge badge-muted">连接中…</span>
      <span id="latency-badge" class="badge badge-muted">—</span>
    </div>
  </header>

  <main class="layout">
    <section class="card canvas-card">
      <div class="toolbar">
        <div class="tools">
          <button id="undo" class="btn btn-ghost" title="撤销 (Ctrl+Z)">撤销</button>
          <button id="clear" class="btn btn-ghost" title="清空">清空</button>
          <button id="demo" class="btn btn-ghost" title="载入示例">示例</button>
        </div>
        <div class="tools right">
          <label class="switch" title="停笔后自动识别">
            <input type="checkbox" id="auto" checked />
            <span>自动识别</span>
          </label>
          <button id="recognize" class="btn btn-primary" title="识别 (Ctrl+Enter)">识别</button>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="pad"></canvas>
        <div id="empty-hint" class="empty-hint">
          按住鼠标左键书写，支持多笔、分式与上下标
        </div>
      </div>
      <div class="footnote">
        <span>单公式 · 纯数学 · 本地推理</span>
        <span id="stroke-info">0 笔</span>
      </div>
    </section>

    <section class="card result-card">
      <div class="result-head">
        <div class="head-left">
          <h2>识别结果</h2>
          <span id="confidence" class="conf"></span>
        </div>
        <button id="copy" class="btn btn-ghost" title="复制 LaTeX">复制</button>
      </div>
      <div id="render" class="render"><span class="placeholder">识别后在此预览</span></div>
      <label class="field-label" for="latex">LaTeX 源码</label>
      <textarea id="latex" spellcheck="false" placeholder="\frac{1}{2}"></textarea>
      <div class="result-foot">
        <span id="timings" class="timings">—</span>
        <span id="message" class="message"></span>
      </div>
    </section>
  </main>

  <script src="/vendor/katex/dist/katex.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
